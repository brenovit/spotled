[project]
name = "spotled-ble"
version = "0.1.0"
description = "Control SPOTLED Bluetooth LED panels without the phone app (protocol recovered from the official APK)"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22", "pillow>=10"]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest"]

[project.scripts]
spotled = "spotled_ble.cli:main"
spotled-mcp = "spotled_ble.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spotled_ble"]

[tool.setuptools.package-data]
spotled_ble = ["fonts/*.DZK"]
